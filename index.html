<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickCrafter 2D Klon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-gold: #f59e0b;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; }

        #game-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Left Viewport: Canvas & Active Mechanics */
        #viewport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; position: relative; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        
        .top-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .stat-badge { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px; }

        #canvas2d { border-radius: 16px; cursor: pointer; }

        /* Abilities Area */
        .ability-bar { display: flex; gap: 12px; margin-bottom: 10px; z-index: 10; }
        .ability-btn { width: 64px; height: 64px; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; position: relative; }
        .ability-btn:hover:not(.disabled) { border-color: var(--accent-gold); transform: translateY(-2px); }
        .ability-btn.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
        .cd-text { position: absolute; font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: var(--accent-gold); bottom: 4px; }

        /* Right Sidebar Tabs */
        #sidebar { width: 480px; background: var(--panel-bg); border-left: 1px solid var(--border-color); backdrop-filter: blur(16px); display: flex; flex-direction: column; z-index: 20; }
        
        .tabs { display: flex; background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 14px 4px; background: none; border: none; color: #94a3b8; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); background: rgba(245, 158, 11, 0.05); }

        .tab-content { flex: 1; padding: 16px; overflow-y: auto; display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        /* Item & Action Cards */
        .card { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card-info { display: flex; flex-direction: column; gap: 2px; }
        .card-title { font-weight: 700; font-size: 1rem; color: var(--text-main); }
        .card-sub { font-size: 0.85rem; color: #94a3b8; }
        
        .btn-action { background: var(--accent-green); color: #020617; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.15s; }
        .btn-action:hover:not(:disabled) { filter: brightness(1.1); transform: scale(1.02); }
        .btn-action:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        /* Floating Damage Text */
        .dmg-text { position: absolute; font-family: 'Press Start 2P', monospace; font-size: 0.9rem; font-weight: bold; pointer-events: none; animation: floatUp 0.6s forwards ease-out; z-index: 100; text-shadow: 2px 2px 0 #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Viewport Area -->
    <div id="viewport">
        <div class="top-hud">
            <div class="stat-badge">⛏️ PPS: <span id="stat-pps">0</span></div>
            <div class="stat-badge" style="color: var(--accent-purple);">🔮 Runen: <span id="stat-runes">0</span></div>
            <div class="stat-badge" style="color: var(--accent-cyan);">🌍 <span id="stat-biome">Grasland</span></div>
        </div>

        <canvas id="canvas2d" width="400" height="400"></canvas>

        <div class="ability-bar">
            <div class="ability-btn" id="abi-earthquake" onclick="Game.useAbility('earthquake')">
                <span>🌋</span>
                <span class="cd-text" id="cd-earthquake"></span>
            </div>
            <div class="ability-btn" id="abi-tnt" onclick="Game.useAbility('tnt')">
                <span>💣</span>
                <span class="cd-text" id="cd-tnt"></span>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <div id="sidebar">
        <div class="tabs">
            <button class="tab-btn active" onclick="UI.showTab('biomes')">Biome</button>
            <button class="tab-btn" onclick="UI.showTab('pickaxes')">Hacke</button>
            <button class="tab-btn" onclick="UI.showTab('inventory')">Inventar</button>
            <button class="tab-btn" onclick="UI.showTab('crafting')">Crafting</button>
            <button class="tab-btn" onclick="UI.showTab('chests')">Kisten</button>
            <button class="tab-btn" onclick="UI.showTab('prestige')">Reset</button>
        </div>

        <div id="tab-biomes" class="tab-content active"></div>
        <div id="tab-pickaxes" class="tab-content"></div>
        <div id="tab-inventory" class="tab-content">
            <div class="grid-2" id="inv-grid"></div>
        </div>
        <div id="tab-crafting" class="tab-content"></div>
        <div id="tab-chests" class="tab-content"></div>
        <div id="tab-prestige" class="tab-content">
            <div class="card" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                <span class="card-title" style="color: var(--accent-purple); font-size: 1.2rem;">Transzendenz</span>
                <span class="card-sub">Setze deine Rohstoffe und Spitzhacken zurück, um mächtige Runen zu verdienen.</span>
                <div style="font-weight: 700; color: var(--accent-gold);">Mögliche Runen: <span id="prestige-gain">0</span></div>
                <button class="btn-action" style="width: 100%; background: var(--accent-purple); color: #fff;" onclick="Game.prestige()">Transzendieren</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// DATA DEFINITIONS
// ==========================================
const BIOMES = {
    plains: {
        id: 'plains', name: 'Grasland', reqBlocks: 0,
        blocks: [
            { id: 'dirt', name: 'Erde', hp: 10, color: '#8B5A2B', weight: 70 },
            { id: 'stone', name: 'Stein', hp: 25, color: '#808080', weight: 25 },
            { id: 'iron_ore', name: 'Eisenerz', hp: 60, color: '#D4A373', weight: 5 }
        ]
    },
    cave: {
        id: 'cave', name: 'Höhle', reqBlocks: 100,
        blocks: [
            { id: 'stone', name: 'Stein', hp: 50, color: '#808080', weight: 50 },
            { id: 'gold_ore', name: 'Golderz', hp: 150, color: '#FFD700', weight: 30 },
            { id: 'diamond_ore', name: 'Diamanterz', hp: 400, color: '#00FFFF', weight: 20 }
        ]
    },
    nether: {
        id: 'nether', name: 'Nether', reqBlocks: 500,
        blocks: [
            { id: 'netherrack', name: 'Netherrack', hp: 800, color: '#800000', weight: 70 },
            { id: 'soul_sand', name: 'Seelensand', hp: 1500, color: '#4A3B32', weight: 30 }
        ]
    }
};

const PICKAXES = {
    wood: { id: 'wood', name: 'Holzspitzhacke', dmg: 2, pps: 0.5, cost: { dirt: 10 }, color: '#8B5A2B' },
    stone: { id: 'stone', name: 'Steinspitzhacke', dmg: 8, pps: 2, cost: { stone: 25 }, color: '#808080' },
    iron: { id: 'iron', name: 'Eisenspitzhacke', dmg: 25, pps: 5, cost: { iron_ingot: 10 }, color: '#D4A373' },
    diamond: { id: 'diamond', name: 'Diamantspitzhacke', dmg: 100, pps: 15, cost: { diamond_ore: 20 }, color: '#00FFFF' }
};

const RECIPES = [
    { id: 'iron_ingot', name: 'Eisenbarren', cost: { iron_ore: 3 }, output: { iron_ingot: 1 } },
    { id: 'wooden_chest', name: 'Holzkiste', cost: { dirt: 50, stone: 20 }, output: { wooden_chest: 1 } }
];

// ==========================================
// GAME ENGINE & STATE
// ==========================================
const Game = {
    inventory: {},
    unlockedPickaxes: ['wood'],
    equippedPickaxe: 'wood',
    currentBiome: 'plains',
    runes: 0,
    totalBlocksBroken: 0,

    currentBlock: null,
    currentBlockHp: 0,

    cooldowns: { earthquake: 0, tnt: 0 },

    init() {
        this.loadSave();
        this.spawnNewBlock();
        RenderEngine.init();
        UI.init();

        // Game Loop (PPS & Cooldowns)
        setInterval(() => this.tick(), 1000);
        setInterval(() => this.save(), 10000);
    },

    save() {
        const state = {
            inventory: this.inventory,
            unlockedPickaxes: this.unlockedPickaxes,
            equippedPickaxe: this.equippedPickaxe,
            currentBiome: this.currentBiome,
            runes: this.runes,
            totalBlocksBroken: this.totalBlocksBroken
        };
        localStorage.setItem('pickcrafter_2d_save', JSON.stringify(state));
    },

    loadSave() {
        const data = localStorage.getItem('pickcrafter_2d_save');
        if (data) {
            try {
                const parsed = JSON.parse(data);
                Object.assign(this, parsed);
            } catch(e) { console.error("Savegame corrupt", e); }
        }
    },

    spawnNewBlock() {
        const biome = BIOMES[this.currentBiome];
        const totalWeight = biome.blocks.reduce((s, b) => s + b.weight, 0);
        let roll = Math.random() * totalWeight;

        for (let b of biome.blocks) {
            if (roll < b.weight) {
                this.currentBlock = b;
                this.currentBlockHp = b.hp;
                break;
            }
            roll -= b.weight;
        }
    },

    clickBlock(e) {
        const pick = PICKAXES[this.equippedPickaxe];
        const runeBonus = 1 + (this.runes * 0.1);
        const dmg = Math.floor(pick.dmg * runeBonus);

        RenderEngine.triggerSwing();
        RenderEngine.spawnParticles(e.clientX, e.clientY, this.currentBlock.color);
        UI.spawnDamageText(e.clientX, e.clientY, `-${dmg}`);

        this.damageBlock(dmg);
    },

    damageBlock(amount) {
        this.currentBlockHp -= amount;
        if (this.currentBlockHp <= 0) {
            this.addItem(this.currentBlock.id, 1);
            this.totalBlocksBroken++;
            this.spawnNewBlock();
        }
        UI.updateHUD();
    },

    tick() {
        // Auto-PPS Damage
        const pick = PICKAXES[this.equippedPickaxe];
        if (pick.pps > 0) {
            this.damageBlock(pick.pps);
        }

        // Cooldown Management
        for (let cd in this.cooldowns) {
            if (this.cooldowns[cd] > 0) this.cooldowns[cd]--;
        }
        UI.updateCDs();
    },

    addItem(id, amount) {
        this.inventory[id] = (this.inventory[id] || 0) + amount;
        UI.updateHUD();
    },

    hasItems(costObj) {
        for (let id in costObj) {
            if ((this.inventory[id] || 0) < costObj[id]) return false;
        }
        return true;
    },

    consumeItems(costObj) {
        if (!this.hasItems(costObj)) return false;
        for (let id in costObj) {
            this.inventory[id] -= costObj[id];
        }
        return true;
    },

    useAbility(type) {
        if (this.cooldowns[type] > 0) return;

        if (type === 'earthquake') {
            const dmg = Math.floor(this.currentBlock.hp * 0.4);
            this.damageBlock(dmg);
            this.cooldowns.earthquake = 20;
        } else if (type === 'tnt') {
            this.damageBlock(200);
            this.cooldowns.tnt = 35;
        }
        UI.updateCDs();
    },

    craft(recipeId) {
        const recipe = RECIPES.find(r => r.id === recipeId);
        if (recipe && this.consumeItems(recipe.cost)) {
            for (let id in recipe.output) {
                this.addItem(id, recipe.output[id]);
            }
            UI.updateHUD();
        }
    },

    openChest(chestId) {
        if (this.consumeItems({ [chestId]: 1 })) {
            const rewardRunes = Math.floor(Math.random() * 3) + 1;
            this.runes += rewardRunes;
            this.addItem('iron_ore', 10);
            alert(`Kiste geöffnet! Du hast +${rewardRunes} Runen & 10 Eisenerz erhalten!`);
            UI.updateHUD();
        }
    },

    prestige() {
        const gain = Math.floor(this.totalBlocksBroken / 100);
        if (gain <= 0) return;

        this.runes += gain;
        this.inventory = {};
        this.unlockedPickaxes = ['wood'];
        this.equippedPickaxe = 'wood';
        this.totalBlocksBroken = 0;
        this.currentBiome = 'plains';
        this.spawnNewBlock();
        UI.updateHUD();
    }
};

// ==========================================
// CANVAS 2D RENDER ENGINE
// ==========================================
const RenderEngine = {
    canvas: null, ctx: null,
    swingAngle: 0, isSwinging: false, particles: [],

    init() {
        this.canvas = document.getElementById('canvas2d');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.addEventListener('mousedown', (e) => Game.clickBlock(e));
        requestAnimationFrame(() => this.render());
    },

    triggerSwing() {
        this.isSwinging = true;
        this.swingAngle = -Math.PI / 4;
    },

    spawnParticles(x, y, color) {
        const rect = this.canvas.getBoundingClientRect();
        const px = x - rect.left;
        const py = y - rect.top;

        for (let i = 0; i < 8; i++) {
            this.particles.push({
                x: px, y: py,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6 - 2,
                color: color, size: Math.random() * 6 + 4,
                life: 1.0
            });
        }
    },

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        const centerX = 200;
        const centerY = 200;

        // Draw 2D Block
        if (Game.currentBlock) {
            this.ctx.fillStyle = Game.currentBlock.color;
            this.ctx.fillRect(centerX - 60, centerY - 60, 120, 120);
            this.ctx.strokeStyle = '#000';
            this.ctx.lineWidth = 4;
            this.ctx.strokeRect(centerX - 60, centerY - 60, 120, 120);

            // Health Bar
            const hpPct = Math.max(0, Game.currentBlockHp / Game.currentBlock.hp);
            this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
            this.ctx.fillRect(centerX - 60, centerY + 75, 120, 12);
            this.ctx.fillStyle = '#10b981';
            this.ctx.fillRect(centerX - 60, centerY + 75, 120 * hpPct, 12);
        }

        // Draw Pickaxe
        this.ctx.save();
        this.ctx.translate(centerX + 50, centerY - 20);

        if (this.isSwinging) {
            this.swingAngle += 0.15;
            if (this.swingAngle >= 0) {
                this.swingAngle = 0;
                this.isSwinging = false;
            }
        }

        this.ctx.rotate(this.swingAngle);
        
        // Handle
        this.ctx.fillStyle = '#5c3d2e';
        this.ctx.fillRect(-5, -60, 10, 80);
        // Head
        const pickColor = PICKAXES[Game.equippedPickaxe].color;
        this.ctx.fillStyle = pickColor;
        this.ctx.fillRect(-30, -70, 60, 15);

        this.ctx.restore();

        // Render Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.04;

            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = Math.max(0, p.life);
            this.ctx.fillRect(p.x, p.y, p.size, p.size);

            if (p.life <= 0) this.particles.splice(i, 1);
        }
        this.ctx.globalAlpha = 1.0;

        requestAnimationFrame(() => this.render());
    }
};

// ==========================================
// USER INTERFACE MANAGER
// ==========================================
const UI = {
    init() {
        this.updateHUD();
    },

    showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        event.target.classList.add('active');
        this.updateHUD();
    },

    updateHUD() {
        document.getElementById('stat-pps').innerText = PICKAXES[Game.equippedPickaxe].pps;
        document.getElementById('stat-runes').innerText = Game.runes;
        document.getElementById('stat-biome').innerText = BIOMES[Game.currentBiome].name;
        document.getElementById('prestige-gain').innerText = Math.floor(Game.totalBlocksBroken / 100);

        this.renderBiomes();
        this.renderPickaxes();
        this.renderInventory();
        this.renderCrafting();
        this.renderChests();
    },

    updateCDs() {
        for (let cd in Game.cooldowns) {
            const txt = document.getElementById(`cd-${cd}`);
            const btn = document.getElementById(`abi-${cd}`);
            if (txt) txt.innerText = Game.cooldowns[cd] > 0 ? `${Game.cooldowns[cd]}s` : '';
            if (btn) btn.classList.toggle('disabled', Game.cooldowns[cd] > 0);
        }
    },

    renderBiomes() {
        const c = document.getElementById('tab-biomes');
        c.innerHTML = '';
        for (let id in BIOMES) {
            const b = BIOMES[id];
            const unlocked = Game.totalBlocksBroken >= b.reqBlocks;
            const isCurrent = Game.currentBiome === id;

            c.innerHTML += `
                <div class="card">
                    <div class="card-info">
                        <span class="card-title">${b.name}</span>
                        <span class="card-sub">Benötigt: ${b.reqBlocks} Abbauten</span>
                    </div>
                    <button class="btn-action" ${!unlocked || isCurrent ? 'disabled' : ''} onclick="Game.currentBiome='${id}'; Game.spawnNewBlock(); UI.updateHUD();">
                        ${isCurrent ? 'Aktiv' : 'Reisen'}
                    </button>
                </div>
            `;
        }
    },

    renderPickaxes() {
        const c = document.getElementById('tab-pickaxes');
        c.innerHTML = '';
        for (let id in PICKAXES) {
            const p = PICKAXES[id];
            const unlocked = Game.unlockedPickaxes.includes(id);
            const isEquipped = Game.equippedPickaxe === id;
            const canAfford = Game.hasItems(p.cost);

            let costText = Object.entries(p.cost).map(([item, qty]) => `${qty}x ${item}`).join(', ');

            c.innerHTML += `
                <div class="card">
                    <div class="card-info">
                        <span class="card-title" style="color:${p.color}">${p.name}</span>
                        <span class="card-sub">DMG: ${p.dmg} | PPS: ${p.pps}</span>
                        <span class="card-sub">${unlocked ? 'Freigeschaltet' : 'Kosten: ' + costText}</span>
                    </div>
                    <button class="btn-action" ${(!unlocked && !canAfford) || isEquipped ? 'disabled' : ''} onclick="UI.handlePickaxeAction('${id}')">
                        ${isEquipped ? 'Aktiv' : unlocked ? 'Ausrüsten' : 'Kaufen'}
                    </button>
                </div>
            `;
        }
    },

    handlePickaxeAction(id) {
        if (!Game.unlockedPickaxes.includes(id)) {
            if (Game.consumeItems(PICKAXES[id].cost)) {
                Game.unlockedPickaxes.push(id);
                Game.equippedPickaxe = id;
            }
        } else {
            Game.equippedPickaxe = id;
        }
        UI.updateHUD();
    },

    renderInventory() {
        const c = document.getElementById('inv-grid');
        c.innerHTML = '';
        for (let id in Game.inventory) {
            if (Game.inventory[id] > 0) {
                c.innerHTML += `
                    <div class="card">
                        <div class="card-info">
                            <span class="card-title">${id}</span>
                            <span class="card-sub">Anzahl: ${Game.inventory[id]}</span>
                        </div>
                    </div>
                `;
            }
        }
    },

    renderCrafting() {
        const c = document.getElementById('tab-crafting');
        c.innerHTML = '';
        RECIPES.forEach(r => {
            const canCraft = Game.hasItems(r.cost);
            let costText = Object.entries(r.cost).map(([item, qty]) => `${qty}x ${item}`).join(', ');

            c.innerHTML += `
                <div class="card">
                    <div class="card-info">
                        <span class="card-title">${r.name}</span>
                        <span class="card-sub">Kosten: ${costText}</span>
                    </div>
                    <button class="btn-action" ${!canCraft ? 'disabled' : ''} onclick="Game.craft('${r.id}')">Craften</button>
                </div>
            `;
        });
    },

    renderChests() {
        const c = document.getElementById('tab-chests');
        const count = Game.inventory['wooden_chest'] || 0;
        c.innerHTML = `
            <div class="card">
                <div class="card-info">
                    <span class="card-title">Holzkiste</span>
                    <span class="card-sub">Im Inventar: ${count}</span>
                </div>
                <button class="btn-action" ${count <= 0 ? 'disabled' : ''} onclick="Game.openChest('wooden_chest')">Öffnen</button>
            </div>
        `;
    },

    spawnDamageText(x, y, txt) {
        const el = document.createElement('div');
        el.className = 'dmg-text';
        el.innerText = txt;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.color = '#fbbf24';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 600);
    }
};

window.onload = () => Game.init();
</script>
</body>
</html>
